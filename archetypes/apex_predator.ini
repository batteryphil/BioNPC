# BioNPC Designer Tuning Profile: apex_predator
# Game designers can tune sensory multipliers, chemical decay, and action clamps here
# without retraining the underlying PyTorch CTRNN weights.

[archetype]
name = apex_predator
senses = prey_sight,threat_sight,hunger,aggression
actions = chase,attack,flee

[architecture]
d_in = 4
d_out = 3
d_model = 32
n_layers = 2

[chemistry]
